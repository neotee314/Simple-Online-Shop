name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JDK 26
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://download.java.net/java/early_access/jdk26/GA/openjdk-26-ea+35_linux-x64_bin.tar.gz
          sudo tar -xzf openjdk-26-ea+35_linux-x64_bin.tar.gz -C /opt/
          echo "JAVA_HOME=/opt/jdk-26" >> $GITHUB_ENV
          echo "/opt/jdk-26/bin" >> $GITHUB_PATH
          java -version

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/