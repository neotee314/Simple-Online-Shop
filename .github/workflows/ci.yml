name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew test --no-daemon