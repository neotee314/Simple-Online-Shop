name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26-ea'
          distribution: 'oracle'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit